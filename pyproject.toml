[project]
name = "journal-figure-formatter"
version = "1.0.0"
description = "Tudományos kéziratok ábráinak, táblázatainak és egyenleteinek kiadói formázása"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1", "pypdf>=4.0", "Pillow>=10.1", "opencv-python-headless>=4.8",
    "numpy>=1.26", "pandas>=2.1", "openpyxl>=3.1", "Jinja2>=3.1", "matplotlib>=3.8",
    "lxml>=4.9", "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
manuscript-formatter = "manuscript_formatter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manuscript_formatter*"]

[tool.setuptools.package-data]
manuscript_formatter = ["builtin_templates/*.json", "export/latex_templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
